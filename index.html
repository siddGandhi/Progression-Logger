<!DOCTYPE html>
<html>
  <head>
    <title>Lift Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="manifest.json">

  </head>
  <body>
    <h2>Workout Logger</h2>

    <a href="view.html" class="page-switch">View Logs</a>

    <form id="logForm">
      <div class="field-container">
        <input
          type="search"
          id="movement"
          placeholder="Movement"
          autocomplete="off"
          required
        />
        <div id="suggestions"></div>
      </div>
      <input
        type="number"
        inputmode="numeric"
        id="reps"
        placeholder="Reps"
        required
      />
      <input
        type="text"
        inputmode="decimal"
        id="weight"
        placeholder="Weight"
        required
      />
      <button type="submit">Log Workout</button>

      <div class="intensity-container">
        <label for="failureCheck">Failure?</label>
        <input type="checkbox" id="failureCheck" style="width: auto; margin-left: 0px;" checked>
      </div>
    </form>

    <p id="response"></p>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker registration failed', err));
        });
      }

      
    </script>

    <script type="module">
      import { officialMovements } from "./movements.js";
      import { workoutService } from "./db-service.js";

      const form = document.getElementById("logForm");
      const movementInput = document.getElementById("movement");
      const repsInput = document.getElementById("reps");
      const weightInput = document.getElementById("weight");
      const response = document.getElementById("response");
      const failureCheck = document.getElementById("failureCheck");
      
      movementInput.addEventListener("focus", () => {
        movementInput.select(); // Highlights the text so typing immediately replaces it
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const enteredMovement = movementInput.value.trim();
        const weightValue = parseFloat(weightInput.value); // Converts "12.5" back to a float
        const isFailure = failureCheck.checked ? 1 : 0;

        if (!officialMovements.includes(enteredMovement)) {
          response.textContent = "Invalid movement. Please select from the list.";
          return;
        }

        try {
          await workoutService.addWorkout(
            enteredMovement, 
            repsInput.value, 
            weightValue, // Send the cleaned number to Firebase
            isFailure
          );
          
          response.textContent = "Workout logged";
          repsInput.value = "";
          weightInput.value = "";
          failureCheck.checked = true;
        } catch (err) {
          console.error("Submission Error:", err);
          response.textContent = "Error: " + err.message;
        }
      });

      // --- Suggestions Logic ---
      const suggestionsBox = document.getElementById("suggestions");

      movementInput.addEventListener("input", () => {
        const val = movementInput.value.toLowerCase();
        suggestionsBox.innerHTML = "";
        
        if (!val) {
          suggestionsBox.style.display = "none";
          return;
        }

        // Filter movements from movements.js
        const filtered = officialMovements.filter(m => m.toLowerCase().includes(val));
        
        if (filtered.length > 0) {
          filtered.forEach(m => {
            const div = document.createElement("div");
            div.className = "suggestion-item";
            div.textContent = m;
            
            // When a user clicks a suggestion
            div.onclick = () => {
              movementInput.value = m;
              suggestionsBox.style.display = "none";
            };
            suggestionsBox.appendChild(div);
          });
          suggestionsBox.style.display = "block";
        } else {
          suggestionsBox.style.display = "none";
        }
      });

      // Close the suggestions if the user clicks anywhere else
      window.addEventListener("click", (e) => {
        if (e.target !== movementInput) {
          suggestionsBox.style.display = "none";
        }
      });

      weightInput.addEventListener("input", (e) => {
        // Allow only numbers and a single decimal point
        let value = e.target.value;
        
        // Remove any character that isn't a digit or a dot
        value = value.replace(/[^0-9.]/g, "");

        // Prevent multiple decimal points (e.g., 12.5.5 becomes 12.55)
        const parts = value.split(".");
        if (parts.length > 2) {
          value = parts[0] + "." + parts.slice(1).join("");
        }

        e.target.value = value;
      });

    </script>
  </body>
</html>
